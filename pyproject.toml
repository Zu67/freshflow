[project]
name = "freshflow"
version = "0.1.0"
description = "Ask Meridian Markets' sales and shrink data questions in plain language"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "openai>=3.41.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freshflow"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
freshflow = "freshflow.cli:main"
